server.port=8080

# Banco H2 local por padrao (modo MySQL habilitado para compatibilidade com o DER)
spring.datasource.url=jdbc:h2:file:./data/eloplus;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Para usar MySQL local em producao/desenvolvimento, substitua pelas variaveis abaixo:
# spring.datasource.url=jdbc:mysql://localhost:3306/eloplus?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=${DB_USER:root}
# spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.h2.console.enabled=true

# Segredo para assinatura HMAC (configure via variavel de ambiente em producao)
eloplus.security.token-secret=${SESSION_SECRET:}
eloplus.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
